<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Strava</title>
<style>
  :root{--bg:#0e1013;--card:#171b21;--fg:#f2f4f7;--mut:#8b94a1;--acc:#fc4c02}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,sans-serif;padding:32px 5vw;max-width:1200px;margin:auto}
  h1{font-size:2rem;font-weight:900}h1 b{color:var(--acc)}
  .bar{display:flex;gap:10px;margin:18px 0 28px;flex-wrap:wrap}
  button{background:var(--card);color:var(--mut);border:1px solid #262d36;border-radius:99px;padding:8px 18px;cursor:pointer;font:inherit}
  button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
  .kpi,.card{background:var(--card);border-radius:16px;padding:20px}
  .kpi strong{display:block;font-size:1.9rem;color:var(--acc)}
  .kpi span{color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
  .card{margin-bottom:20px}.card h2{font-size:1rem;margin-bottom:14px;color:var(--mut)}
  svg{width:100%;height:auto;display:block}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #232a33}th{color:var(--mut);font-weight:600}
  #msg{color:var(--mut);margin-bottom:16px}
</style>
</head>
<body>
<h1>Meu <b>Strava</b></h1>
<div id="msg"></div>
<div class="bar" id="filters"></div>
<div class="kpis" id="kpis"></div>
<div class="card"><h2>Distância por mês (km)</h2><div id="chartMonth"></div></div>
<div class="card"><h2>Velocidade média por pedalada (km/h)</h2><div id="chartSpeed"></div></div>
<div class="card"><h2>Últimas atividades</h2><table id="tbl"></table></div>

<script>
let ALL=[],type='Ride';
const fmt=(n,d=0)=>n.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const hms=s=>Math.floor(s/3600)+'h'+String(Math.floor(s%3600/60)).padStart(2,'0');

async function load(){
  try{
    ALL=await (await fetch('data/activities.json')).json();
  }catch(e){
    document.getElementById('msg').textContent='Sem dados ainda. Rode "py sync_strava.py" e abra via "py -m http.server 8000".';
    return;
  }
  const types=[...new Set(ALL.map(a=>a.sport_type||a.type))];
  if(!types.includes(type))type=types[0];
  const f=document.getElementById('filters');
  f.innerHTML='';
  types.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===type?'on':'';
    b.onclick=()=>{type=t;load2()};f.appendChild(b)});
  load2();
}
function load2(){
  [...document.querySelectorAll('#filters button')].forEach(b=>b.className=b.textContent===type?'on':'');
  const d=ALL.filter(a=>(a.sport_type||a.type)===type);
  const km=d.reduce((s,a)=>s+a.distance,0)/1000,t=d.reduce((s,a)=>s+a.moving_time,0),el=d.reduce((s,a)=>s+a.total_elevation_gain,0);
  const best=d.reduce((m,a)=>Math.max(m,a.max_speed||0),0)*3.6;
  document.getElementById('kpis').innerHTML=[
    [fmt(d.length),'Atividades'],[fmt(km)+' km','Distância'],[hms(t),'Tempo em movimento'],
    [fmt(el)+' m','Elevação'],[fmt(km/(t/3600||1),1)+' km/h','Vel. média'],[fmt(best,1)+' km/h','Vel. máxima']
  ].map(([v,l])=>`<div class="kpi"><strong>${v}</strong><span>${l}</span></div>`).join('');
  // meses
  const m={};d.forEach(a=>{const k=a.start_date_local.slice(0,7);m[k]=(m[k]||0)+a.distance/1000});
  const keys=Object.keys(m).sort().slice(-18);bars('chartMonth',keys.map(k=>[k.slice(2),m[k]]));
  const last=d.slice(0,40).reverse();
  bars('chartSpeed',last.map(a=>[a.start_date_local.slice(5,10),a.distance/a.moving_time*3.6]),1);
  document.getElementById('tbl').innerHTML='<tr><th>Data</th><th>Nome</th><th>Km</th><th>Tempo</th><th>Vel.</th><th>Elev.</th></tr>'+
    d.slice(0,15).map(a=>`<tr><td>${a.start_date_local.slice(0,10)}</td><td>${a.name}</td><td>${fmt(a.distance/1000,1)}</td><td>${hms(a.moving_time)}</td><td>${fmt(a.distance/a.moving_time*3.6,1)}</td><td>${fmt(a.total_elevation_gain)} m</td></tr>`).join('');
}
function bars(id,data,dec=0){
  if(!data.length){document.getElementById(id).innerHTML='';return}
  const W=900,H=240,p=28,max=Math.max(...data.map(d=>d[1]))||1,bw=(W-p*2)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  data.forEach(([l,v],i)=>{const h=(H-p*2)*v/max,x=p+i*bw;
    s+=`<rect x="${x+3}" y="${H-p-h}" width="${bw-6}" height="${h}" rx="4" fill="#fc4c02"><title>${l}: ${fmt(v,1)}</title></rect>`;
    if(data.length<=20)s+=`<text x="${x+bw/2}" y="${H-8}" fill="#8b94a1" font-size="11" text-anchor="middle">${l}</text>`});
  document.getElementById(id).innerHTML=s+'</svg>';
}
load();
</script>
</body>
</html>
